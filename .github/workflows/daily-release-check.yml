name: Daily Release Check

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "America/Denver"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run free daily release updater
        env:
          ITUNES_COUNTRY: US
          RELEASE_LOOKBACK_DAYS: 90
          RELEASE_LOOKAHEAD_DAYS: 365
          MAX_ARTISTS: 250
          MAX_RELEASES_PER_ARTIST: 12
          REQUEST_DELAY_MS: 1100
          INCLUDE_MUSICBRAINZ: true
        run: node scripts/updateReleases.js

      - name: Commit updated release data
        run: |
          if git diff --quiet data/releases.json; then
            echo "No release changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          git commit -m "Update daily music releases"
          git push
